<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link
  rel="stylesheet"
  href="https://unpkg.com/98.css"
>
</head>
<body>
    <div class="window" style="width: 300px">
        <div class="title-bar">
            <div class="title-bar-text">To-Do List</div>
            <div class="title-bar-controls">
            <button aria-label="Minimize"></button>
            <button aria-label="Maximize"></button>
            <button aria-label="Close"></button>
            </div>
        </div>
        <div class="window-body">
            <p>Progress:</p>

            <div class="progress-indicator segmented">
                <span class="progress-indicator-bar" style="width: 40%;" />
            </div>
           
            <fieldset>
                <legend>To-Do List</legend>
                <div class="field-row">
                    <input type="checkbox" id="example1">
                    <label for="example1">Task is listed here.</label>
                </div>
                <div class="field-row">
                    <input type="checkbox" id="example2">
                    <label for="example2">This is a checkbox</label>
                </div>
                <div class="field-row">
                    <input type="checkbox" id="example3">
                    <label for="example3">This is a checkbox</label>
                </div>
            </fieldset>

            <p>------------------------------------------------------------------------</p>
            
            <div class="field-row-stacked" style="width: 200px">
                <label for="text20">Enter to-do task here:</label>
                <textarea id="text20" rows="8"></textarea>
            </div>
            <button>Add</button>
        </div>
    </div>
</body>
</html>
