<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link
  rel="stylesheet"
  href="https://unpkg.com/98.css"
>

</head>
<body style="background-image: url('./media/BAR.png');">
    <div class="window" style="width: 100%">
        <div class="title-bar">
            <div class="title-bar-text">To-Do List</div>
            <div class="title-bar-controls">
            <!-- <button aria-label="Minimize"></button>
            <button aria-label="Maximize"></button> -->
            <button aria-label="Close"></button>
            </div>
        </div>
        <div class="window-body">
            <!-- Progress Bar-->
            <p>Your Progress:</p>
            <div class="progress-indicator segmented">
                <span class="progress-indicator-bar" style="width: 100%;" />
            </div>
           <!-- Where task entries are displayed -->
            <fieldset >
                <legend>To-Do List</legend>
                <!--This needs to be create dynamically-->
                <div id="myList">
                    <!-- <div class="field-row">
                    <input type="checkbox" id="example1">
                    <label for="example1">Task is listed here.</label>
                    </div> -->
                </div>
                
                
            </fieldset>
            <!--Dashes to seperate input section from the list-->
           <div id="border" style="border-top-style:dashed; margin-top: 3%; margin-bottom: 2%;border-width: thin;">

           </div>

            <!--  Form to accept user input.-->
            <div class="field-row-stacked" style="width: 100%">
                <label for="textInput">Enter TO-DO task here:</label>
                <textarea id="textInput" rows="4"></textarea>
            </div>

            <!-- Button to accept user input -->
            <button id="addButton">Add</button>
            <button id="clearButton">CLEAR list</button>
        </div>
    </div>
    <script src = "JS/logic.js"></script>
</body>
</html>
